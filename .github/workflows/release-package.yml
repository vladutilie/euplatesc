name: EuPlătesc

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: yarn
      - run: yarn lint
      - run: yarn test

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write # lets the job mint the OIDC token npm trusted publishing needs
    steps:
      - uses: actions/checkout@v4
      - name: Setup .npmrc file to publish to npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install modules
        run: yarn
      - name: Build
        run: yarn build
      - name: Publish to npm
        # Trusted publishing (OIDC) replaces NPM_TOKEN: npm classic tokens were
        # permanently revoked on 2025-12-09. It is implemented by the npm CLI
        # only, so this step cannot use `yarn publish`, and it needs npm >=
        # 11.5.1, which is newer than the version Node 24 bundles.
        run: |
          npm install -g npm@latest
          npm publish --access public
      - name: Setup .npmrc file to publish to GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vladutilie'
      - run: yarn run addscope
      - name: Publish to GitHub Packages
        run: yarn publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}